name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI pytest and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install test tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run CLI tests
        run: python -m pytest -q

      - name: Lint CLI subjects
        run: python3 scripts/coach.py lint

  web:
    name: Web checks and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # next build generates the .next/types files imported by next-env.d.ts.
      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck

      - name: Run web unit tests (concurrency 2)
        working-directory: web
        run: npm test -- --test-concurrency=2

      - name: Run local production E2E
        working-directory: web
        env:
          ZEIRISHI_E2E_PRODUCTION: '1'
        run: npm run test:e2e

      # This is an isolated entry smoke with external Auth/DB and mail disabled.
      - name: Run online-mode mocked E2E
        working-directory: web
        run: npx playwright test --config playwright.online.config.ts

      # The default E2E skips the bookkeeping MVP spec; this runs it with ZEIRISHI_BOOKKEEPING_MVP=1.
      - name: Run bookkeeping MVP E2E
        working-directory: web
        run: npm run test:e2e:bookkeeping

  verification:
    name: 検証結果の回収
    needs: [cli, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 成功・失敗・未確認を実行に結び付けて記録
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_result.py
